<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboards - Tier Realms</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1a0026, #3a0066, #6a00ff);
    color: white;
}

/* Header */
.header {
    position: absolute;
    top: 20px;
    left: 70px;
    font-size: 22px;
    font-weight: 700;
}

/* Menu */
.menu-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    font-size: 28px;
    cursor: pointer;
}

/* Sidebar */
.sidebar {
    position: fixed;
    top: 0;
    left: -250px;
    width: 250px;
    height: 100%;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    padding-top: 60px;
    transition: 0.4s;
}

.sidebar a {
    display: block;
    padding: 15px 25px;
    color: white;
    text-decoration: none;
}

.sidebar a:hover {
    background: #6a00ff;
}

/* Leaderboard */
.container {
    padding: 120px 20px;
    text-align: center;
}

table {
    margin: auto;
    border-collapse: collapse;
    width: 80%;
    max-width: 700px;
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    overflow: hidden;
}

th, td {
    padding: 15px;
}

th {
    background: rgba(255,255,255,0.1);
}

tr:hover {
    background: rgba(255,255,255,0.08);
}
</style>
</head>

<body>

<div class="menu-btn" onclick="toggleMenu()">☰</div>

<div id="sidebar" class="sidebar">
    <a href="/">Home</a>
    <a href="/leaderboards/">Leaderboards</a>
    <a href="https://discord.gg/qJaMjCkqDk" target="_blank">Discord</a>
</div>

<div class="header">Tier Realms Network</div>

<div class="container">
    <h1>Top Players</h1>

    <table>
        <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Points</th>
        </tr>
        <tr>
            <td>#1</td>
            <td>PlayerOne</td>
            <td>2500</td>
        </tr>
        <tr>
            <td>#2</td>
            <td>PlayerTwo</td>
            <td>2300</td>
        </tr>
        <tr>
            <td>#3</td>
            <td>PlayerThree</td>
            <td>2100</td>
        </tr>
    </table>
</div>

<script>
function toggleMenu() {
    let sidebar = document.getElementById("sidebar");
    sidebar.style.left = (sidebar.style.left === "0px") ? "-250px" : "0px";
}
</script>

</body>
</html>
